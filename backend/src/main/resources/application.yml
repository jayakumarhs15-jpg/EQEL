spring:
  application:
    name: eqel-backend

  # --- DataSource ---
  datasource:
    url: jdbc:mysql://${EQEL_DB_HOST:localhost}:${EQEL_DB_PORT:3306}/${EQEL_DB_NAME:eqel_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${EQEL_DB_USER:eqel_user}
    password: ${EQEL_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  # --- JPA ---
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # --- Flyway ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # --- Jackson ---
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# --- Server ---
server:
  port: ${EQEL_SERVER_PORT:8081}
  error:
    include-message: always
    include-binding-errors: always

# --- Logging ---
logging:
  level:
    com.eqel: INFO
    org.springframework.security: INFO
    org.flywaydb: INFO

# --- EQEL Custom ---
eqel:
  decision-engine-version: "1.0.0"
  placement-demo:
    enabled: ${EQEL_PLACEMENT_DEMO_ENABLED:false}
  cors:
    allowed-origins: ${EQEL_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
